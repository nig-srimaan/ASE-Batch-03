name: Adaptive ML MAPE-K CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-12-components-and-mapek:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train & Evaluate Candidate ML Models (Components 1-3)
        run: python -m backend.app.cli train

      - name: Run Full Bidirectional MAPE-K Lifecycle Demo
        run: python -m backend.app.cli demo

      - name: Execute Automated Unit & Scenario Verification Suite
        run: python -m unittest discover -s tests -v
